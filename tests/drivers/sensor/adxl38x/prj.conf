CONFIG_ZTEST=y
CONFIG_SENSOR=y

# SPI + register-file emulator backend
CONFIG_SPI=y
CONFIG_EMUL=y
CONFIG_SPI_EMUL=y

# Trigger (GPIO interrupt) + RTIO FIFO streaming + decoder
CONFIG_GPIO=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SPI_RTIO=y
CONFIG_ADXL38X_STREAM=y

# Power management (TC-PM-001)
CONFIG_PM_DEVICE=y

CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_WRN=y
