# RTIO FIFO streaming path for the ADXL380.
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SPI_RTIO=y
CONFIG_ADXL38X_STREAM=y

# Surface the driver's init/runtime error messages on the console.
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
